name: Apply hreflang 401-1000
on:
  push:
    branches: [main]
    paths:
      - scripts/add_hreflang_401_1000.py
      - .github/workflows/apply-hreflang-401-1000.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python scripts/add_hreflang_401_1000.py
      - run: |
          rm -f scripts/add_hreflang_401_1000.py .github/workflows/apply-hreflang-401-1000.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator scripts/add_hreflang_401_1000.py .github/workflows/apply-hreflang-401-1000.yml
          git commit -m "add hreflang to English tools 401-1000"
          git push origin HEAD:main
