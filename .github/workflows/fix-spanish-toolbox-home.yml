name: Fix Spanish toolbox home link

on:
  push:
    branches: [main]
    paths:
      - scripts/fix_spanish_toolbox_home.py
      - .github/workflows/fix-spanish-toolbox-home.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/fix_spanish_toolbox_home.py
      - name: Commit changes
        run: |
          rm -f scripts/fix_spanish_toolbox_home.py .github/workflows/fix-spanish-toolbox-home.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add es/calculator scripts/fix_spanish_toolbox_home.py .github/workflows/fix-spanish-toolbox-home.yml
          git commit -m "fix Spanish toolbox home link"
          git push
