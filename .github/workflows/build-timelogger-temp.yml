name: Temporary TimeLogger APK Build

on:
  push:
    paths:
      - '.github/workflows/build-timelogger-temp.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TimeLogger branch
        uses: actions/checkout@v4
        with:
          ref: timelogger-build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        working-directory: timelogger
        run: /tmp/gradle-8.9/bin/gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp timelogger/app/build/outputs/apk/debug/app-debug.apk TimeLogger-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TimeLogger-v1.0-apk
          path: TimeLogger-v1.0.apk
          if-no-files-found: error
